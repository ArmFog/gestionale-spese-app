<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestione Spese & Guadagni</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Firebase v10 SDK via CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    // ⚠️ SOSTITUISCI QUESTI VALORI CON LA TUA CONFIGURAZIONE FIREBASE
    const firebaseConfig = {
  apiKey: "AIzaSyCqM_2gyZ7-Mkwl8mVAKt3e8lv-0JjiZ6M",
  authDomain: "miogestionalespese.firebaseapp.com",
  projectId: "miogestionalespese",
  storageBucket: "miogestionalespese.firebasestorage.app",
  messagingSenderId: "22564262005",
  appId: "1:22564262005:web:c1ecc1360ca70defe9283c"
};

    // Inizializzazione Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
  </script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans pb-12">

  <!-- Header -->
  <header class="bg-indigo-600 text-white p-4 shadow-md mb-6">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <span>💰</span> Gestione Spese & Guadagni
      </h1>
      <span class="text-xs bg-indigo-700 px-3 py-1 rounded-full border border-indigo-500">Firebase Sync</span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 space-y-6">

    <!-- Schede Riassuntive -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <p class="text-xs text-slate-500 uppercase font-semibold">Entrate Totali</p>
        <p id="total-income" class="text-2xl font-bold text-emerald-600">€ 0,00</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <p class="text-xs text-slate-500 uppercase font-semibold">Uscite Totali</p>
        <p id="total-expense" class="text-2xl font-bold text-rose-600">€ 0,00</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <p class="text-xs text-slate-500 uppercase font-semibold">Saldo Netto</p>
        <p id="net-balance" class="text-2xl font-bold text-slate-800">€ 0,00</p>
      </div>
    </div>

    <!-- Form Aggiunta Movimento -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-lg font-semibold mb-4 text-slate-700">Nuovo Movimento</h2>
      <form id="transaction-form" onsubmit="addTransaction(event)" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Tipo</label>
            <select id="type" onchange="toggleCategoryOptions()" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
              <option value="spesa">Spesa (Uscita)</option>
              <option value="guadagno">Guadagno (Entrata)</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Importo (€)</label>
            <input type="number" id="amount" step="0.01" min="0.01" required placeholder="0.00" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Descrizione</label>
            <input type="text" id="description" required placeholder="Es. Spesa al supermercato" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Categoria</label>
            <select id="category" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
              <!-- Categorie Spese -->
              <option value="Alimentari">Alimentari</option>
              <option value="Casa & Bollette">Casa & Bollette</option>
              <option value="Trasporti">Trasporti</option>
              <option value="Svago & Ristorazione">Svago & Ristorazione</option>
              <option value="Salute">Salute</option>
              <option value="Altro">Altro</option>
            </select>
          </div>

          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-slate-600 mb-1">Data</label>
            <input type="date" id="date" required class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-lg shadow transition">
          Salva Movimento
        </button>
      </form>
    </div>

    <!-- Grafico e Lista -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- Grafico -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 md:col-span-1">
        <h3 class="text-md font-semibold mb-4 text-slate-700">Ripartizione Spese</h3>
        <div class="relative w-full aspect-square flex items-center justify-center">
          <canvas id="expenseChart"></canvas>
        </div>
      </div>

      <!-- Lista Transazioni -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 md:col-span-2">
        <h3 class="text-md font-semibold mb-4 text-slate-700">Storico Movimenti</h3>
        <div id="loading" class="text-center py-6 text-slate-400">Caricamento dati da Firebase...</div>
        <div id="empty-state" class="hidden text-center py-6 text-slate-400">Nessun movimento presente.</div>
        
        <ul id="transaction-list" class="divide-y divide-slate-100 max-h-96 overflow-y-auto">
          <!-- I movimenti caricati da Firebase appariranno qui -->
        </ul>
      </div>

    </div>

  </main>

  <script>
    // Imposta la data odierna nel form
    document.getElementById('date').valueAsDate = new Date();

    let chartInstance = null;

    // Cambia le categorie a seconda se è una Spesa o un Guadagno
    function toggleCategoryOptions() {
      const type = document.getElementById('type').value;
      const categorySelect = document.getElementById('category');
      
      if (type === 'guadagno') {
        categorySelect.innerHTML = `
          <option value="Stipendio">Stipendio</option>
          <option value="Vendite">Vendite</option>
          <option value="Investimenti">Investimenti</option>
          <option value="Altro Entrata">Altro</option>
        `;
      } else {
        categorySelect.innerHTML = `
          <option value="Alimentari">Alimentari</option>
          <option value="Casa & Bollette">Casa & Bollette</option>
          <option value="Trasporti">Trasporti</option>
          <option value="Svago & Ristorazione">Svago & Ristorazione</option>
          <option value="Salute">Salute</option>
          <option value="Altro">Altro</option>
        `;
      }
    }

    // Aggiungi un movimento su Firebase Firestore
    async function addTransaction(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = "Salvataggio in corso...";

      const item = {
        type: document.getElementById('type').value,
        amount: parseFloat(document.getElementById('amount').value),
        description: document.getElementById('description').value,
        category: document.getElementById('category').value,
        date: document.getElementById('date').value,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      try {
        await db.collection("transazioni").add(item);
        document.getElementById('transaction-form').reset();
        document.getElementById('date').valueAsDate = new Date();
      } catch (error) {
        alert("Errore durante il salvataggio: " + error.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Salva Movimento";
      }
    }

    // Elimina un movimento da Firebase Firestore
    async function deleteTransaction(id) {
      if (confirm("Sei sicuro di voler eliminare questo movimento?")) {
        try {
          await db.collection("transazioni").doc(id).delete();
        } catch (error) {
          alert("Errore nell'eliminazione: " + error.message);
        }
      }
    }

    // Ascolta i cambiamenti in tempo reale dal database Firebase
    function initFirebaseListener() {
      db.collection("transazioni").orderBy("date", "desc")
        .onSnapshot((snapshot) => {
          document.getElementById('loading').classList.add('hidden');
          
          const transactions = [];
          snapshot.forEach((doc) => {
            transactions.push({ id: doc.id, ...doc.data() });
          });

          renderApp(transactions);
        }, (error) => {
          document.getElementById('loading').innerText = "Errore di connessione a Firebase. Verifica la configurazione.";
          console.error(error);
        });
    }

    // Aggiorna l'interfaccia utente (Grafico, Saldi, Lista)
    function renderApp(items) {
      const listEl = document.getElementById('transaction-list');
      const emptyEl = document.getElementById('empty-state');
      
      listEl.innerHTML = '';

      if (items.length === 0) {
        emptyEl.classList.remove('hidden');
      } else {
        emptyEl.classList.add('hidden');
      }

      let totalIncome = 0;
      let totalExpense = 0;
      const expenseByCategory = {};

      items.forEach((item) => {
        if (item.type === 'guadagno') {
          totalIncome += item.amount;
        } else {
          totalExpense += item.amount;
          expenseByCategory[item.category] = (expenseByCategory[item.category] || 0) + item.amount;
        }

        // Renderizza riga nella lista
        const li = document.createElement('li');
        li.className = 'py-3 flex justify-between items-center';
        
        const isExpense = item.type === 'spesa';
        const amountClass = isExpense ? 'text-rose-600' : 'text-emerald-600';
        const amountSign = isExpense ? '-' : '+';

        li.innerHTML = `
          <div>
            <p class="font-medium text-slate-800">${item.description}</p>
            <p class="text-xs text-slate-400">${item.date} • <span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded">${item.category}</span></p>
          </div>
          <div class="flex items-center gap-3">
            <span class="font-bold ${amountClass}">${amountSign}€ ${item.amount.toFixed(2)}</span>
            <button onclick="deleteTransaction('${item.id}')" class="text-slate-300 hover:text-rose-500 transition">
              🗑️
            </button>
          </div>
        `;
        listEl.appendChild(li);
      });

      // Aggiorna Totali
      document.getElementById('total-income').innerText = `€ ${totalIncome.toFixed(2)}`;
      document.getElementById('total-expense').innerText = `€ ${totalExpense.toFixed(2)}`;
      const net = totalIncome - totalExpense;
      const netEl = document.getElementById('net-balance');
      netEl.innerText = `€ ${net.toFixed(2)}`;
      netEl.className = `text-2xl font-bold ${net >= 0 ? 'text-slate-800' : 'text-rose-600'}`;

      // Aggiorna Grafico
      renderChart(expenseByCategory);
    }

    // Disegna il Grafico a Ciambella
    function renderChart(expenseData) {
      const ctx = document.getElementById('expenseChart').getContext('2d');
      const labels = Object.keys(expenseData);
      const data = Object.values(expenseData);

      if (chartInstance) {
        chartInstance.destroy();
      }

      if (labels.length === 0) {
        return;
      }

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: data,
            backgroundColor: [
              '#f87171', '#3b82f6', '#f59e0b', '#10b981', '#8b5cf6', '#64748b'
            ]
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { position: 'bottom' }
          }
        }
      });
    }

    // Avvia l'ascolto di Firebase al caricamento della pagina
    window.onload = initFirebaseListener;
  </script>
</body>
</html>
